name: RagSec baseline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          PYTHONPATH=. pytest backend/tests/ -q

      - name: Start OPA policy service
        run: |
          docker run -d --name ragsec-ci-opa -p 127.0.0.1:18181:8181 \
            -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.4.2-static \
            run --server --addr=0.0.0.0:8181 /policies
          sleep 2

      - name: Run protected firewall tests
        env:
          RAGSEC_TEST_OPA_URL: http://127.0.0.1:18181
        run: PYTHONPATH=. pytest tests/ -q

      - name: Check Rego
        run: |
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.4.2-static check --strict /policies
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.4.2-static test /policies -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ragsec-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: ragsec-frontend:latest
