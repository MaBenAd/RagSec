# RagSec inherited baseline services. Firewall, LangGraph and OPA are not integrated yet.
name: ragsec

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://ensa_user:ensa_pass@postgres:5432/ensa_db}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./backend:/app/backend

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ensa_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ensa_pass}
      - POSTGRES_DB=${POSTGRES_DB:-ensa_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  postgres_data:
